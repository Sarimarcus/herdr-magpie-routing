id = "olivier.magpie-routing"
name = "Magpie Routing"
version = "0.5.1"
min_herdr_version = "0.9.0"
description = "Live view of magpie's model routing: which model each group sends to, fallbacks, quotas and the latest requests."
platforms = ["linux", "macos"]

[[panes]]
id = "routing"
title = "magpie routing"
placement = "tab"
command = ["sh", "bin/run.sh"]

[[actions]]
id = "open"
title = "Open magpie routing tab"
description = "Open the live magpie routing view in a new tab."
command = ["sh", "bin/open.sh"]
